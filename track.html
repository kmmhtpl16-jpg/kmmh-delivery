<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ติดตามการจัดส่ง | กิจมั่งมีโฮม</title>
<meta name="theme-color" content="#0f766e">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun","Noto Sans Thai",sans-serif;
     background:#f1f5f9;color:#0f172a;font-size:15px;line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:0 14px 40px}
.top{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:18px 14px 42px;text-align:center}
.top .shop{font-size:19px;font-weight:700;letter-spacing:.3px}
.top .sub{font-size:12.5px;opacity:.9;margin-top:2px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(15,23,42,.08);padding:16px;margin-top:14px}
.card.lift{margin-top:-28px}
.bill{font-size:13px;color:#64748b}
.billno{font-size:22px;font-weight:800;letter-spacing:.5px;margin-top:2px}
.cust{font-size:15px;font-weight:600;margin-top:6px;color:#334155}
.badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-top:10px}
.b-booked{background:#fef3c7;color:#92400e}
.b-out{background:#dbeafe;color:#1e40af}
.b-done{background:#dcfce7;color:#166534}
.b-cancel{background:#fee2e2;color:#991b1b}
.tl{margin-top:6px}
.step{display:flex;gap:12px;padding:2px 0}
.dot{position:relative;width:26px;flex:0 0 26px;display:flex;justify-content:center}
.dot i{width:15px;height:15px;border-radius:50%;background:#cbd5e1;margin-top:6px;z-index:2;border:3px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.dot:before{content:"";position:absolute;top:14px;bottom:-10px;width:2px;background:#e2e8f0}
.step:last-child .dot:before{display:none}
.step.on .dot i{background:#14b8a6;box-shadow:0 0 0 1px #14b8a6}
.step.now .dot i{background:#0f766e;box-shadow:0 0 0 4px #99f6e4}
.step.cancel .dot i{background:#ef4444;box-shadow:0 0 0 1px #ef4444}
.stxt{padding:4px 0 16px;flex:1}
.stxt b{font-size:15px;color:#94a3b8}
.step.on .stxt b,.step.now .stxt b,.step.cancel .stxt b{color:#0f172a}
.stxt span{display:block;font-size:13px;color:#64748b}
.rows{margin-top:2px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #e2e8f0;font-size:14px}
.row:last-child{border-bottom:0}
.row .k{color:#64748b;flex:0 0 auto}
.row .v{font-weight:600;text-align:right}
.h{font-size:15px;font-weight:700;margin:0 0 10px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pics img{width:100%;height:120px;object-fit:cover;border-radius:10px;background:#e2e8f0;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;font-size:15px;font-weight:700;
     cursor:pointer;text-align:center;text-decoration:none}
.btn-map{background:#0f766e;color:#fff;margin-top:12px}
.btn-go{background:#0f766e;color:#fff;margin-top:14px}
.inp{width:100%;padding:12px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:16px;margin-top:6px;font-family:inherit}
.lbl{font-size:13.5px;color:#475569;font-weight:600;margin-top:12px;display:block}
.err{background:#fee2e2;color:#991b1b;padding:11px 13px;border-radius:11px;font-size:14px;margin-top:12px}
.foot{text-align:center;font-size:12px;color:#94a3b8;margin-top:18px;line-height:1.8}
.foot a{color:#0f766e;font-weight:600;text-decoration:none}
.hide{display:none}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99}
.lb.show{display:flex}
.lb img{max-width:96%;max-height:88%;border-radius:8px}
.lb .x{position:absolute;top:14px;right:18px;color:#fff;font-size:30px;font-weight:300}
.spin{text-align:center;padding:34px 0;color:#64748b;font-size:14px}
</style>
</head>
<body>

<div class="top">
  <div class="shop">🏠 กิจมั่งมีโฮม</div>
  <div class="sub">ติดตามสถานะการจัดส่ง</div>
</div>

<div class="wrap">

  <!-- ฟอร์มกรอกเลขบิล -->
  <div id="formCard" class="card lift hide">
    <div class="h">🔎 ตรวจสอบสถานะสินค้า</div>
    <label class="lbl">เลขที่บิล</label>
    <input class="inp" id="fBill" placeholder="เช่น KM6908-0168" autocomplete="off">
    <label class="lbl">เบอร์โทร 4 ตัวท้าย</label>
    <input class="inp" id="fKey" placeholder="เช่น 1614" inputmode="numeric" maxlength="4" autocomplete="off">
    <button class="btn btn-go" onclick="submitForm()">ดูสถานะ</button>
    <div id="formErr" class="err hide"></div>
    <div class="foot">ใช้เบอร์โทรที่แจ้งไว้ตอนสั่งสินค้า</div>
  </div>

  <!-- กำลังโหลด -->
  <div id="loading" class="card lift">
    <div class="spin">กำลังตรวจสอบ…</div>
  </div>

  <!-- ผลลัพธ์ -->
  <div id="result" class="hide">
    <div class="card lift">
      <div class="bill">เลขที่บิล</div>
      <div class="billno" id="rBill">—</div>
      <div class="cust" id="rCust"></div>
      <span class="badge" id="rBadge">—</span>
    </div>

    <div class="card hide" id="rTlCard">
      <div class="h">🚚 สถานะการจัดส่ง</div>
      <div class="tl" id="rTl"></div>
    </div>

    <div class="card hide" id="rPicCard">
      <div class="h">📸 รูปตอนส่งสินค้า</div>
      <div class="pics" id="rPics"></div>
    </div>

    <div class="card" id="rInfoCard">
      <div class="h">📋 รายละเอียด</div>
      <div class="rows" id="rRows"></div>
      <a id="rMap" class="btn btn-map hide" target="_blank" rel="noopener">📍 เปิดพิกัดหน้างาน Google Map</a>
    </div>
  </div>

  <div class="foot">
    มีข้อสงสัยเรื่องการจัดส่ง ติดต่อร้านได้เลยครับ
    <span id="telWrap" class="hide"><br><a href="#" id="shopTel">📞 โทรหาร้าน</a></span>
  </div>
</div>

<div class="lb" id="lb" onclick="this.classList.remove('show')">
  <span class="x">&times;</span><img id="lbImg" alt="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB_URL='https://hfystbdqjhftrlelmkjm.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmeXN0YmRxamhmdHJsZWxta2ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTc3MDUsImV4cCI6MjA5NDczMzcwNX0.cyRCwh0G6ArSevhsKa6kmPnYhLRRJYrxhlH0ED_JJaE';
var SHOP_TEL='';   /* ใส่เบอร์ร้านตรงนี้ เช่น '0812345678' — ถ้าเว้นว่างปุ่มโทรจะไม่โชว์ */
var db=null;
var TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
var _cur={bill:'',key:'',token:''};

function $(id){ return document.getElementById(id); }
function show(id,on){ $(id).classList[on?'remove':'add']('hide'); }
function qs(n){ try{ return new URLSearchParams(location.search).get(n)||''; }catch(e){ return ''; } }

/* วันที่ = พ.ศ. เสมอ */
function thDate(s){
  if(!s) return '';
  var m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return s;
  return parseInt(m[3],10)+' '+TH_MON[parseInt(m[2],10)-1]+' '+(parseInt(m[1],10)+543);
}
function thDateTs(ms){
  if(!ms) return '';
  var d=new Date(Number(ms)+7*3600000);   /* บังคับเวลาไทย ไม่อิงนาฬิกาเครื่องลูกค้า */
  if(isNaN(d.getTime())) return '';
  return d.getUTCDate()+' '+TH_MON[d.getUTCMonth()]+' '+(d.getUTCFullYear()+543)+
         ' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+' น.';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

var ERRS={
  not_found:'ไม่พบเลขบิลนี้ในระบบ ลองตรวจตัวเลขอีกครั้งครับ',
  bad_key:'เบอร์โทร 4 ตัวท้ายไม่ถูกต้อง',
  no_phone:'บิลนี้ไม่มีเบอร์โทรบันทึกไว้ กรุณาติดต่อร้านครับ',
  no_bill:'กรุณากรอกเลขที่บิล',
  too_many:'กรอกผิดหลายครั้งเกินไป กรุณาลองใหม่อีก 15 นาที'
};

async function lookup(bill,key,token,fromForm){
  if(!db){ try{ db=supabase.createClient(SB_URL,SB_KEY); }catch(e){} }
  if(!db){ return {ok:false,error:'network'}; }
  var r=await db.rpc('track_delivery',{p_bill:bill,p_key:key||null,p_token:token||null});
  if(r.error){ console.warn(r.error); return {ok:false,error:'network'}; }
  return r.data||{ok:false,error:'network'};
}

function render(d){
  show('loading',false); show('formCard',false); show('result',true);

  $('rBill').textContent=d.bill||'—';
  $('rCust').textContent=d.customer||'';

  var badge=$('rBadge'), st=d.stage;
  var map={booked:['b-booked','🟡 รับออเดอร์แล้ว'],
           out:['b-out','🔵 รถกำลังไปส่ง'],
           done:['b-done','🟢 ส่งสำเร็จแล้ว'],
           cancelled:['b-cancel','🔴 ยกเลิกรายการ']};
  var m=map[st]||map.booked;
  badge.className='badge '+m[0]; badge.textContent=m[1];

  /* ไทม์ไลน์ */
  var steps;
  if(st==='cancelled'){
    steps=[['on','รับออเดอร์แล้ว',thDateTs(d.bookedAt)],
           ['cancel','ยกเลิกรายการ','กรุณาติดต่อร้าน']];
  }else{
    var dateTxt=thDate(d.date||d.deliveryDate);
    steps=[
      ['on','รับออเดอร์แล้ว', thDateTs(d.bookedAt)],
      [st==='booked'?'':(st==='out'?'now':'on'),'รถออกจากร้านแล้ว',
        d.timeOut?(dateTxt+' เวลา '+d.timeOut+' น.'):(st==='booked'?'รอจัดคิวรถ':'')],
      [st==='done'?'now':'','ส่งถึงปลายทางแล้ว',
        d.timeArrival?(dateTxt+' เวลา '+d.timeArrival+' น.'):'']
    ];
  }
  $('rTl').innerHTML=steps.map(function(s){
    return '<div class="step '+s[0]+'"><div class="dot"><i></i></div><div class="stxt"><b>'+
           esc(s[1])+'</b><span>'+esc(s[2]||'')+'</span></div></div>';
  }).join('');
  // ส่งแล้ว/กำลังส่ง = มีเวลาในตารางรายละเอียดอยู่แล้ว ไม่ต้องโชว์ไทม์ไลน์ซ้ำ
  show('rTlCard', !(st==='done' || st==='out'));

  /* รายละเอียด */
  var rows=[];
  if(d.deliveryDate) rows.push(['วันที่จัดส่ง',thDate(d.deliveryDate)]);
  if(d.driver)  rows.push(['พนักงานส่ง',d.driver]);
  if(d.car)     rows.push(['รถที่ใช้ส่ง',d.car]);
  if(d.timeOut) rows.push(['เวลารถออก',d.timeOut+' น.']);
  if(d.timeArrival) rows.push(['เวลาถึงปลายทาง',d.timeArrival+' น.']);
  $('rRows').innerHTML=rows.length
    ? rows.map(function(r){ return '<div class="row"><span class="k">'+esc(r[0])+
        '</span><span class="v">'+esc(r[1])+'</span></div>'; }).join('')
    : '<div class="row"><span class="k">สถานะ</span><span class="v">รอจัดคิวรถ</span></div>';

  if(d.mapUrl && st!=='booked'){
    $('rMap').href=d.mapUrl;
    show('rMap',true);
  }else show('rMap',false);

  /* รูป */
  var ph=(d.photos||[]).filter(function(u){ return typeof u==='string' && u.indexOf('http')===0; });
  if(ph.length){
    $('rPics').innerHTML=ph.map(function(u){
      return '<img loading="eager" src="'+esc(u)+'" onclick="zoom(this.src)" alt="รูปตอนส่ง">'; }).join('');
    show('rPicCard',true);
  }else show('rPicCard',false);
}

function zoom(src){ $('lbImg').src=src; $('lb').classList.add('show'); }

function showForm(msg){
  show('loading',false); show('result',false); show('formCard',true);
  if(msg){ $('formErr').textContent=msg; show('formErr',true); }
  else show('formErr',false);
}

async function go(bill,key,token,fromForm){
  show('formErr',false);
  if(!fromForm){ show('loading',true); show('formCard',false); show('result',false); }
  var d=await lookup(bill,key,token,fromForm);
  if(d && d.ok){
    _cur={bill:bill,key:key||'',token:token||''};
    render(d);
    try{ history.replaceState(null,'','?b='+encodeURIComponent(bill)+
      (token?('&t='+encodeURIComponent(token)):(key?('&k='+encodeURIComponent(key)):''))); }catch(e){}
  }else{
    showForm(ERRS[d&&d.error]||'เชื่อมต่อไม่ได้ กรุณาลองใหม่อีกครั้ง');
    if(bill) $('fBill').value=bill;
  }
}

function submitForm(){
  var b=($('fBill').value||'').trim();
  var k=($('fKey').value||'').replace(/[^0-9]/g,'');
  if(!b){ showForm('กรุณากรอกเลขที่บิล'); return; }
  if(k.length!==4){ showForm('กรุณากรอกเบอร์โทร 4 ตัวท้าย'); return; }
  go(b,k,'',true);
}

/* กด Enter ในช่องกรอก */
document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && !$('formCard').classList.contains('hide')) submitForm();
});

/* รีเฟรชสถานะอัตโนมัติทุก 60 วิ ระหว่างที่ยังส่งไม่เสร็จ */
setInterval(function(){
  if(!_cur.bill) return;
  if($('result').classList.contains('hide')) return;
  lookup(_cur.bill,_cur.key,_cur.token).then(function(d){ if(d&&d.ok) render(d); });
},60000);

/* เริ่มทำงาน */
(function(){
  if(SHOP_TEL){ $('shopTel').href='tel:'+SHOP_TEL; show('telWrap',true); }
  var b=qs('b')||qs('bill'), t=qs('t'), k=qs('k');
  if(b && (t||k)) go(b,k,t,false);
  else if(b){ $('fBill').value=b; showForm(''); }
  else showForm('');
})();
</script>
</body>
</html>
