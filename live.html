var ALERT_MIN=15;       // เงียบเกินกี่นาที ถึงขึ้นธงแดง (นับเฉพาะตอนมีบิลเปิดค้าง)

// ==== PURE HELPERS START ====
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

// เวลาไทยเสมอ (เครื่องที่ร้านอาจตั้ง timezone เพี้ยน)
function fmtTime(iso){
  if(!iso) return '—';
  var d=new Date(iso); if(isNaN(d.getTime())) return '—';
  return d.toLocaleTimeString('th-TH',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false});
}
function fmtDateTime(iso){
  if(!iso) return '—';
  var d=new Date(iso); if(isNaN(d.getTime())) return '—';
  return d.toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'short',
    hour:'2-digit',minute:'2-digit',hour12:false});
}
function minsAgo(iso,now){
  if(!iso) return null;
  var d=new Date(iso); if(isNaN(d.getTime())) return null;
  var m=Math.floor((now.getTime()-d.getTime())/60000);
  return m<0?0:m;
}
function fmtAgo(m){
  if(m==null) return '';
  if(m<1) return 'เมื่อสักครู่';
  if(m<60) return m+' นาทีที่แล้ว';
  var h=Math.floor(m/60), r=m%60;
  if(h<24) return h+' ชม.'+(r?' '+r+' นาที':'')+'ที่แล้ว';
  return Math.floor(h/24)+' วันที่แล้ว';
}
function fmtSpeed(v){
  if(v==null||v==='') return '—';
  var n=Number(v); if(isNaN(n)) return '—';
  return (n<10?n.toFixed(1):Math.round(n))+' กม./ชม.';
}
function fmtBatt(b){
  if(b==null||b==='') return '—';
  var n=Number(b); if(isNaN(n)) return '—';
  return Math.round(n)+'%';
}
function battCls(b){
  var n=Number(b);
  if(b==null||b===''||isNaN(n)) return '';
  if(n<=20) return 'batt-l';
  if(n<=40) return 'batt-m';
  return '';
}
// บิลเปิดค้างของเครื่องนี้ = ยังไม่ถูกยกเลิก + ยังไม่กดสเต็ป 2 (ถ้ามีหลายใบ เอาใบใหม่สุด)
// ⚠️ ห้ามกรอง status='active' — บิลที่กำลังส่งจริงเป็น 'pending' (รออนุมัติ) จะไม่เจอสักใบ
function pickBill(bills,devId){
  if(!bills||!bills.length||!devId) return null;
  var best=null;
  for(var i=0;i<bills.length;i++){
    var b=bills[i];
    if(String(b.device_id||'').trim()!==String(devId).trim()) continue;
    if(!best || Number(b.id||0)>Number(best.id||0)) best=b;
  }
  return best;
}
// สถานะของเครื่อง: nodata = ไม่เคยส่งพิกัด · alert = มีบิลค้าง+เงียบเกิน 15 นาที · on = มีบิลค้าง · idle = ไม่มีบิลค้าง
function deviceState(pos,bill,now){
  if(!pos||pos.lat==null||pos.lon==null) return {level:'nodata',mins:null,flag:false};
  var m=minsAgo(pos.recorded_at,now);
  if(bill && m!=null && m>ALERT_MIN) return {level:'alert',mins:m,flag:true};
  if(bill) return {level:'onjob',mins:m,flag:false};
  return {level:'idle',mins:m,flag:false};
}
function stateChip(st){
  if(st.level==='nodata') return {cls:'',txt:'ยังไม่เคยส่งพิกัด'};
  if(st.level==='alert')  return {cls:'alert',txt:'🔴 มีบิลค้าง · เงียบ '+st.mins+' นาที'};
  if(st.level==='onjob')  return {cls:'on',txt:'🚚 กำลังส่งของ'};
  return {cls:'',txt:'จอด/ว่าง'};
}
function cardCls(st){
  if(st.level==='nodata') return 'none';
  if(st.level==='alert') return 'alert';
  if(st.level==='onjob') return 'on';
  return '';
}
// ข้อความบรรทัดบิลบนหมุด/การ์ด
function billLine(bill){
  if(!bill) return '';
  var p=[];
  if(bill.car) p.push('🚗 '+bill.car);
  if(bill.driver) p.push(bill.driver);
  if(bill.bill) p.push(bill.bill);
  return p.join(' · ');
}
// ชื่อลูกค้าจาก dest (เก็บปนกับ URL แผนที่ "ชื่อ + https://...")
function destName(dest){
  if(!dest) return '';
  return String(dest).split(/https?:\/\//)[0].trim().replace(/[+\s]+$/,'');
}
// เที่ยงคืนวันนี้ตามเวลาไทย → ISO (ใช้ดึงเส้นทางวันนี้)
function thaiDayStartISO(now){
  var d=new Date(now.getTime()+7*3600000);
  var mid=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
  return new Date(mid-7*3600000).toISOString();
}
// กางหมุดที่ซ้อนกัน — คืน {id:{dx,dy}} หน่วยพิกเซล
// จัดกลุ่มหมุดที่อยู่ใกล้กันเกิน minPx แล้ววางเป็นวงกลมรอบจุดแรกของกลุ่ม
// เรียงตาม id ก่อนเสมอ ผลลัพธ์จึงคงที่ ไม่สลับตำแหน่งไปมาทุกครั้งที่รีเฟรช
function spreadOffsets(pts,minPx,radiusPx){
  var out={}, groups=[];
  var sorted=pts.slice().sort(function(a,b){
    var x=String(a.id), y=String(b.id); return x<y?-1:(x>y?1:0);
  });
  sorted.forEach(function(p){
    var hit=null;
    for(var i=0;i<groups.length;i++){
      var c=groups[i][0];
      var dx=p.x-c.x, dy=p.y-c.y;
      if(Math.sqrt(dx*dx+dy*dy)<minPx){ hit=groups[i]; break; }
    }
    if(hit) hit.push(p); else groups.push([p]);
  });
  groups.forEach(function(g){
    if(g.length<2){ out[g[0].id]={dx:0,dy:0}; return; }
    var n=g.length;
    var r=radiusPx+(n>4?(n-4)*8:0);   // กลุ่มใหญ่ขึ้น วงกว้างขึ้น ไม่งั้นยังทับ
    g.forEach(function(p,i){
      var ang=-Math.PI/2+2*Math.PI*i/n;
      out[p.id]={dx:Math.round(Math.cos(ang)*r),dy:Math.round(Math.sin(ang)*r)};
    });
  });
  return out;
}
// ==== PURE HELPERS END ====

/* ---------- ล็อกอินเงียบ (แบบเดียวกับ index.html / queue.html) ---------- */
var LOGIN_URL=SB_URL+'/functions/v1/login';
var DELIV_PIN='2546';
function initDB(){ try{ if(window.supabase){ db=supabase.createClient(SB_URL,SB_KEY); } }catch(e){ console.warn('init',e); } }
async function mintSession(pin){
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
  for(var attempt=0; attempt<3; attempt++){
    var res;
    try{ res=await fetch(LOGIN_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify({pin:pin})}); }
    catch(e){ if(attempt<2){ await sleep(400); continue; } return 'network'; }
    if(res.status===401){ return 'invalid_pin'; }
    var j=await res.json().catch(function(){return {};});
    if(res.ok && j.access_token){
      var r=await db.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
      if(!r.error) return null;
      if(attempt<2){ await sleep(400); continue; }
      return 'session_error';
    }
    if(attempt<2){ await sleep(400); continue; }
    return j.error||('error_'+res.status);
  }
  return 'error';
}
async function ensureSession(){
  if(!db) return false;
  try{ var s=await db.auth.getSession(); if(s&&s.data&&s.data.session) return true; }catch(e){}
  var err=await mintSession(DELIV_PIN);
  if(err) console.warn('auto-login:',err);
  return !err;
}

/* ---------- แผนที่ ---------- */
var map=null, markers={}, trailLine=null, trailDev=null;
var spreadLines=[];
var SPREAD_MIN_PX=48;    // ใกล้กันกว่านี้ถือว่าทับกัน (รถจอดที่ร้านห่างกัน 13–60 ม.)
var SPREAD_R_PX=42;      // รัศมีวงที่กางออก — 2 คันจะห่างกัน 84 px อ่านป้ายออกทั้งคู่
var devices=[], positions=[], bills=[], follow=null, firstFit=true, timer=null, lastOk=null;

function initMap(){
  map=L.map('map',{zoomControl:true}).setView([17.3586,102.8194],13); // ตั้งต้นที่ร้าน
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  map.on('dragstart',function(){ follow=null; });
  map.on('zoomend',applySpread);   // ซูมแล้วระยะพิกเซลเปลี่ยน ต้องคิดใหม่
}
function setStat(txt,cls){
  var el=document.getElementById('stat');
  el.textContent=txt; el.className='stat'+(cls?' '+cls:'');
}
function pinHtml(name,pos,bill,st){
  var meta=fmtTime(pos.recorded_at)+' · 🔋'+fmtBatt(pos.batt)+' · '+fmtSpeed(pos.speed_kmh);
  var cls=(st.level==='alert')?'alert':(st.level==='onjob'?'on':'');
  var h='<div class="pin '+cls+'"><div class="pn">'+esc(name)+'</div><div class="pm">'+esc(meta)+'</div>';
  if(bill) h+='<div class="pb">'+esc(billLine(bill))+'</div>';
  if(st.level==='alert') h+='<div class="pb">⚠️ เงียบ '+st.mins+' นาที</div>';
  h+='</div><div class="pdot '+cls+'"></div>';
  return h;
}
function popupHtml(name,pos,bill,st){
  var h='<b style="font-size:15px">'+esc(name)+'</b><br>';
  h+='อัปเดตล่าสุด <b>'+fmtTime(pos.recorded_at)+'</b> ('+fmtAgo(st.mins)+')<br>';
  h+='แบต <b>'+fmtBatt(pos.batt)+'</b> · ความเร็ว <b>'+fmtSpeed(pos.speed_kmh)+'</b><br>';
  if(pos.accuracy!=null) h+='<span style="color:#64748b;font-size:12px">ความแม่นยำ ±'+Math.round(pos.accuracy)+' ม.</span><br>';
  if(bill){
    h+='<hr style="border:0;border-top:1px solid #e2e8f0;margin:6px 0">';
    h+='บิลที่เปิดค้าง <b>'+esc(bill.bill||'—')+'</b><br>รถ '+esc(bill.car||'—')+' · คนขับ '+esc(bill.driver||'—');
    var dn=destName(bill.dest); if(dn) h+='<br>ปลายทาง '+esc(dn);
    if(bill.time_out) h+='<br>ออกเวลา '+esc(bill.time_out);
  }else{
    h+='<span style="color:#64748b;font-size:12px">ยังไม่ผูกกับบิลไหน</span>';
  }
  h+='<br><a href="https://www.google.com/maps?q='+pos.lat+','+pos.lon+'" target="_blank" rel="noopener">เปิดใน Google Maps</a>';
  return h;
}
function renderMap(now){
  var seen={}, bounds=[];
  positions.forEach(function(p){
    if(p.lat==null||p.lon==null) return;
    var bill=pickBill(bills,p.device_id);
    var st=deviceState(p,bill,now);
    var name=p.device_name||('เครื่อง '+p.device_id);
    var icon=L.divIcon({className:'pinwrap',html:pinHtml(name,p,bill,st),iconSize:[0,0],iconAnchor:[0,0]});
    var m=markers[p.device_id];
    if(!m){
      m=L.marker([p.lat,p.lon],{icon:icon}).addTo(map);
      markers[p.device_id]=m;
    }else{
      m.setIcon(icon);
    }
    // ⚠️ พิกัดจริงเก็บไว้ที่ __true เสมอ — ตำแหน่งที่วาดอาจถูกกางออกเพื่อไม่ให้ทับกัน
    // ที่อื่น (จัดกรอบ / ตามรถ / เส้นทาง) ต้องใช้ __true ห้ามใช้ getLatLng()
    m.__true=[p.lat,p.lon];
    m.bindPopup(popupHtml(name,p,bill,st));
    seen[p.device_id]=1; bounds.push([p.lat,p.lon]);
  });
  Object.keys(markers).forEach(function(k){
    if(!seen[k]){ map.removeLayer(markers[k]); delete markers[k]; }
  });
  applySpread();
  if(firstFit && bounds.length){ fitAll(); firstFit=false; }
  else if(follow && markers[follow]){ map.panTo(markers[follow].__true); }
}

// กางหมุดที่ทับกัน แล้วลากเส้นบาง ๆ กลับไปที่จุดจริง
function applySpread(){
  if(!map) return;
  spreadLines.forEach(function(l){ try{ map.removeLayer(l); }catch(e){} });
  spreadLines=[];
  var keys=Object.keys(markers).filter(function(k){ return markers[k].__true; });
  if(!keys.length) return;
  var pts=keys.map(function(k){
    var pt=map.latLngToLayerPoint(L.latLng(markers[k].__true));
    return {id:k,x:pt.x,y:pt.y};
  });
  var off=spreadOffsets(pts,SPREAD_MIN_PX,SPREAD_R_PX);
  pts.forEach(function(p){
    var m=markers[p.id], o=off[p.id]||{dx:0,dy:0};
    if(!o.dx && !o.dy){ m.setLatLng(m.__true); return; }
    var to=map.layerPointToLatLng(L.point(p.x+o.dx,p.y+o.dy));
    m.setLatLng(to);
    spreadLines.push(L.polyline([m.__true,to],
      {color:'#94a3b8',weight:1.5,opacity:.9,dashArray:'3,3',interactive:false}).addTo(map));
  });
}
function fitAll(){
  var b=[]; Object.keys(markers).forEach(function(k){ b.push(markers[k].__true||markers[k].getLatLng()); });
  if(!b.length) return;
  if(b.length===1) map.setView(b[0],16);
  else map.fitBounds(L.latLngBounds(b).pad(0.25));
}
function renderList(now){
  var posMap={}; positions.forEach(function(p){ posMap[p.device_id]=p; });
  var rows=devices.length?devices:positions.map(function(p){return {device_id:p.device_id,name:p.device_name};});
  var html='', nAlert=0, nOn=0;
  rows.forEach(function(d){
    var p=posMap[d.device_id]||null;
    var bill=pickBill(bills,d.device_id);
    var st=deviceState(p,bill,now);
    if(st.level==='alert') nAlert++;
    if(st.level==='alert'||st.level==='onjob') nOn++;
    var chip=stateChip(st);
    html+='<div class="dcard '+cardCls(st)+'">';
    html+='<div class="nm">'+esc(d.name||('เครื่อง '+d.device_id))+' <span class="chip '+chip.cls+'">'+esc(chip.txt)+'</span></div>';
    if(p){
      html+='<div class="row">🕘 อัปเดตล่าสุด <b>'+fmtTime(p.recorded_at)+'</b> <span style="color:#94a3b8">('+fmtAgo(st.mins)+')</span></div>';
      html+='<div class="row">🔋 <span class="'+battCls(p.batt)+'">'+fmtBatt(p.batt)+'</span> · ความเร็ว '+fmtSpeed(p.speed_kmh)+'</div>';
      if(bill) html+='<div class="bill">'+esc(billLine(bill))+(destName(bill.dest)?'<br>📍 '+esc(destName(bill.dest)):'')+'</div>';
      html+='<div class="acts">'+
            '<button class="sbtn'+(follow===d.device_id?' act':'')+'" data-go="'+esc(d.device_id)+'">📍 ดูบนแผนที่</button>'+
            '<button class="sbtn'+(trailDev===d.device_id?' act':'')+'" data-trail="'+esc(d.device_id)+'">🛣️ เส้นทางวันนี้</button>'+
            '</div>';
    }else{
      html+='<div class="row" style="color:#94a3b8">ยังไม่มีพิกัดเข้าระบบ — ยังไม่ได้ติดตั้ง Traccar หรือยังไม่เปิดเครื่อง</div>';
    }
    html+='</div>';
  });
  if(!html) html='<div class="dcard none">ยังไม่มีเครื่องในระบบ</div>';
  document.getElementById('list').innerHTML=html;
  document.getElementById('sideHd').textContent='รายการเครื่อง ('+rows.length+' เครื่อง · กำลังส่งของ '+nOn+')';
  var f2=document.getElementById('foot2');
  f2.textContent=(nAlert? '🔴 '+nAlert+' เครื่องเงียบผิดปกติ · ' : '')+'ข้อมูลล่าสุด '+(lastOk?fmtTime(lastOk):'—');
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(b){
    b.onclick=function(){ goTo(b.getAttribute('data-go')); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-trail]'),function(b){
    b.onclick=function(){ toggleTrail(b.getAttribute('data-trail')); };
  });
}
function goTo(dev){
  var m=markers[dev]; if(!m) return;
  // เลื่อนไปจุดจริง ไม่ใช่ตำแหน่งที่กางออก
  follow=dev; map.setView(m.getLatLng(),16); m.openPopup(); renderList(new Date());
}
async function toggleTrail(dev){
  if(trailDev===dev){ clearTrail(); renderList(new Date()); return; }
  clearTrail(); trailDev=dev;
  try{
    var since=thaiDayStartISO(new Date());
    var r=await db.from('vehicle_positions').select('lat,lon,recorded_at')
          .eq('device_id',dev).gte('recorded_at',since)
          .order('recorded_at',{ascending:true}).limit(1000);
    if(r.error) throw r.error;
    var pts=(r.data||[]).filter(function(x){return x.lat!=null&&x.lon!=null;})
            .map(function(x){return [x.lat,x.lon];});
    if(pts.length<2){ setStat('วันนี้ยังไม่มีเส้นทางของเครื่องนี้','warn'); trailDev=null; }
    else{
      trailLine=L.polyline(pts,{color:'#0f766e',weight:4,opacity:.75}).addTo(map);
      map.fitBounds(trailLine.getBounds().pad(0.2)); follow=null;
      setStat('เส้นทางวันนี้ '+pts.length+' จุด');
    }
  }catch(e){ console.warn('trail',e); setStat('ดึงเส้นทางไม่สำเร็จ','err'); trailDev=null; }
  renderList(new Date());
}
function clearTrail(){
  if(trailLine){ map.removeLayer(trailLine); trailLine=null; }
  trailDev=null;
}

/* ---------- ดึงข้อมูล ---------- */
async function loadDevices(){
  try{
    var r=await db.from('gps_devices').select('device_id,name,active').eq('active',true).order('device_id');
    if(!r.error && r.data) devices=r.data;
  }catch(e){ console.warn('devices',e); }
}
async function tick(){
  if(!db) return;
  try{
    var a=await db.from('vehicle_positions_latest').select('*').order('device_id');
    if(a.error) throw a.error;
    var b=await db.from('deliveries')
          .select('id,bill,car,driver,dest,time_out,device_id')
          .neq('status','cancelled').eq('step2_done',false).not('device_id','is',null);
    if(b.error) throw b.error;
    positions=(a.data||[]);
    bills=(b.data||[]).filter(function(x){ return String(x.device_id||'').trim()!==''; });
    // โชว์เฉพาะเครื่องที่ยังเปิดใช้งาน (ถ้าโหลดรายชื่อเครื่องมาได้)
    if(devices.length){
      var ok={}; devices.forEach(function(d){ ok[d.device_id]=1; });
      positions=positions.filter(function(p){ return ok[p.device_id]; });
    }
    var now=new Date(); lastOk=now.toISOString();
    renderMap(now); renderList(now);
    setStat('🟢 อัปเดตอัตโนมัติทุก 20 วินาที');
  }catch(e){
    console.warn('tick',e);
    setStat('⚠️ ดึงข้อมูลไม่สำเร็จ — จะลองใหม่','err');
  }
}
function startPoll(){
  if(timer) return;
  tick();
  timer=setInterval(tick,POLL_MS);
}
function stopPoll(){
  if(timer){ clearInterval(timer); timer=null; }
  setStat('⏸ หยุดอัปเดต (ไม่ได้เปิดดูหน้านี้)','warn');
}

/* ---------- เริ่มทำงาน ---------- */
(async function(){
  initDB(); initMap();
  document.getElementById('btnFit').onclick=function(){ follow=null; clearTrail(); fitAll(); renderList(new Date()); };
  document.getElementById('btnRef').onclick=function(){ tick(); };
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) stopPoll(); else startPoll();
  });
  window.addEventListener('pagehide',stopPoll);
  var ok=await ensureSession();
  if(!ok) setStat('⚠️ เข้าระบบไม่สำเร็จ — ลองรีเฟรชหน้า','err');
  await loadDevices();
  if(!document.hidden) startPoll(); else stopPoll();
})();
</script>
